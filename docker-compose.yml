version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_URI=mongodb://mongo:27017/javaflow
      - DATABASE_NAME=javaflow
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    depends_on:
      - mongo
    networks:
      - javaflow-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - javaflow-network

  # MongoDB Database
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=javaflow
    networks:
      - javaflow-network

volumes:
  mongo-data:

networks:
  javaflow-network:
    driver: bridge
