version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/javaflow
      - SPRING_DATA_MONGODB_DATABASE=javaflow
    depends_on:
      - mongo
    volumes:
      - /Users/kathi.s:/Users/kathi.s
      - /Users/kathi.s/.m2:/root/.m2
    networks:
      - javaflow-net

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8080/api
    depends_on:
      - backend
    networks:
      - javaflow-net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=javaflow
    networks:
      - javaflow-net

volumes:
  mongo-data:

networks:
  javaflow-net:
    driver: bridge
